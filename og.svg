<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0e0a0f"/>
  <!-- Subtle gradient overlay -->
  <radialGradient id="glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#c4748a" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#0e0a0f" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Decorative line top -->
  <line x1="80" y1="60" x2="1120" y2="60" stroke="#c4748a" stroke-width="0.8" opacity="0.4"/>
  <!-- Decorative line bottom -->
  <line x1="80" y1="570" x2="1120" y2="570" stroke="#c4748a" stroke-width="0.8" opacity="0.4"/>
  <!-- Small label -->
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, serif"
    font-size="14" fill="#c4748a" letter-spacing="6" opacity="0.9">A JOURNAL BY GIA CURLS</text>
  <!-- Main title -->
  <text x="600" y="310" text-anchor="middle" font-family="Georgia, serif"
    font-size="96" font-style="italic" font-weight="300" fill="#f0e8ec" letter-spacing="-2">Kinky,</text>
  <text x="600" y="400" text-anchor="middle" font-family="Georgia, serif"
    font-size="96" font-style="italic" font-weight="300" fill="#c4748a" letter-spacing="-2">Free Me</text>
  <!-- Tagline -->
  <text x="600" y="490" text-anchor="middle" font-family="Georgia, serif"
    font-size="18" font-style="italic" fill="#806070" letter-spacing="1">Self discovery through self acceptance and the discovery of pleasure.</text>
  <!-- Corner ornaments -->
  <text x="90" y="75" font-family="Georgia, serif" font-size="18" fill="#c4748a" opacity="0.5">✦</text>
  <text x="1100" y="75" font-family="Georgia, serif" font-size="18" fill="#c4748a" opacity="0.5">✦</text>
  <text x="90" y="562" font-family="Georgia, serif" font-size="18" fill="#c4748a" opacity="0.5">✦</text>
  <text x="1100" y="562" font-family="Georgia, serif" font-size="18" fill="#c4748a" opacity="0.5">✦</text>
</svg>
