<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post — Kinky, Free Me</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:ital,wght@0,400;1,400&family=Bodoni+Moda:ital,wght@0,400;1,400&family=Lora:ital,wght@0,400;1,400&family=Libre+Baskerville:ital,wght@0,400;1,400&family=DM+Serif+Display:ital@0;1&family=Jost:wght@300;400&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

<div id="age-gate"></div>
<div id="toast"></div>

<nav class="site-nav">
  <a href="index.html" class="nav-logo">Kinky, <em>Free Me</em></a>
  <a href="index.html"  class="nav-link">Home</a>
  <a href="blog.html"   class="nav-link">Journal</a>
  <a href="about.html"  class="nav-link">About</a>
  <button class="nav-cta" onclick="window.location='index.html#newsletter-anchor'">Subscribe</button>
</nav>

<div class="post-wrap" id="post-wrap">
  <p style="color:var(--text-muted)">Loading…</p>
</div>

<div class="newsletter-band" id="post-newsletter" style="display:none">
  <p class="section-label">The Inner Circle</p>
  <h2>Enjoyed this story?</h2>
  <p>Subscribe to receive essays directly in your inbox — once a week.</p>
  <div class="newsletter-row">
    <input type="email" id="ns-email" placeholder="your@email.com">
    <button onclick="subscribe('ns-email','ns-ok')">Subscribe</button>
  </div>
  <p class="ns-success" id="ns-ok">Welcome. ✦</p>
</div>

<footer class="site-footer">
  <div class="footer-bottom" style="justify-content:center">
    <a href="blog.html" style="font-family:var(--font-label);font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted)">← Back to Journal</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  // Age gate
  document.getElementById('age-gate').outerHTML = `
  <div id="age-gate">
    <div class="age-box">
      <div class="logo-ag">Kinky, <em>Free Me</em></div>
      <div class="age-line"></div>
      <h2>Are you 18 or older?</h2>
      <p>This site contains adult content. Please confirm your age to continue.</p>
      <div class="age-btns">
        <button class="btn btn-primary" onclick="ageConfirm()">Yes, I'm 18+</button>
        <button class="btn btn-ghost" onclick="ageLeave()">No, take me back</button>
      </div>
    </div>
  </div>`;

  const id = parseInt(sessionStorage.getItem('kfm_read_id'));
  const post = KFM.getPosts().find(p => p.id === id);
  const wrap = document.getElementById('post-wrap');

  if (!post) {
    wrap.innerHTML = `<p class="post-back" onclick="history.back()">← Back</p><p style="color:var(--text-muted)">Post not found.</p>`;
  } else {
    const label = KFM.tagLabel(post.tag);
    const paras = post.body.split('\n').filter(l => l.trim()).map(l => `<p>${l}</p>`).join('');
    const isMember = KFM.isSubscribed();
    const isPremium = post.premium === 'yes';

    const cover = post.photo
      ? `<div class="post-cover"><img src="${post.photo}" alt="${post.title}"></div>`
      : `<div class="post-cover"><div class="post-cover-placeholder">✦</div></div>`;

    let bodyHtml;
    if (isPremium && !isMember) {
      const preview = post.body.split('\n').filter(l => l.trim()).slice(0,2).map(l=>`<p>${l}</p>`).join('');
      const rest    = post.body.split('\n').filter(l => l.trim()).slice(2).map(l=>`<p>${l}</p>`).join('');
      bodyHtml = `
        <div class="post-body">${preview}</div>
        <div class="post-body blur-zone">${rest}</div>
        <div class="premium-gate">
          <h3>This story is for members</h3>
          <p>Subscribe (it's free) to unlock this piece and every premium story.</p>
          <button class="btn btn-primary" onclick="document.getElementById('post-newsletter').style.display='block';document.getElementById('post-newsletter').scrollIntoView({behavior:'smooth'})">Join the Circle — Free</button>
        </div>`;
    } else {
      bodyHtml = `<div class="post-body">${paras}</div>`;
      document.getElementById('post-newsletter').style.display = 'block';
    }

    document.title = post.title + ' — Kinky, Free Me';
    wrap.innerHTML = `
      <span class="post-back" onclick="history.back()">← Back to Journal</span>
      <div class="post-tag">${label}</div>
      <h1 class="post-title">${post.title}</h1>
      ${post.subtitle ? `<p class="post-subtitle">${post.subtitle}</p>` : ''}
      <div class="post-meta">
        <span>Gia Curls</span>
        <span>${KFM.formatDate(post.date)}</span>
        <span>${isPremium ? '✦ Members' : 'Free read'}</span>
      </div>
      ${cover}
      ${bodyHtml}`;
  }
</script>
</body>
</html>
<script>
(async () => {
  const id   = parseInt(sessionStorage.getItem('kfm_read_id'));
  const wrap = document.getElementById('post-wrap');
  if (!id) { wrap.innerHTML = '<span class="post-back" onclick="history.back()">← Back</span><p style="color:var(--text-muted)">Post not found.</p>'; return; }

  const { data: post } = await _sb.from('posts').select('*').eq('id',id).single();
  if (!post) { wrap.innerHTML = '<span class="post-back" onclick="history.back()">← Back</span><p style="color:var(--text-muted)">Post not found.</p>'; return; }

  const label     = KFM.tagLabel(post.tag);
  const paras     = post.body.split('\n').filter(l=>l.trim()).map(l=>`<p>${l}</p>`).join('');
  const isMember  = KFM.isSubscribed();
  const isPremium = post.premium === 'yes';

  const cover = post.photo_url
    ? `<div class="post-cover"><img src="${post.photo_url}" alt="${post.title}"></div>`
    : `<div class="post-cover"><div class="post-cover-placeholder">✦</div></div>`;

  let bodyHtml;
  if (isPremium && !isMember) {
    const preview = post.body.split('\n').filter(l=>l.trim()).slice(0,2).map(l=>`<p>${l}</p>`).join('');
    const rest    = post.body.split('\n').filter(l=>l.trim()).slice(2).map(l=>`<p>${l}</p>`).join('');
    bodyHtml = `
      <div class="post-body">${preview}</div>
      <div class="post-body blur-zone">${rest}</div>
      <div class="premium-gate">
        <h3>This story is for members</h3>
        <p>Subscribe (it's free) to unlock this piece and every premium story.</p>
        <button class="btn btn-primary" onclick="document.getElementById('post-newsletter').style.display='block';document.getElementById('post-newsletter').scrollIntoView({behavior:'smooth'})">Join the Circle — Free</button>
      </div>`;
  } else {
    bodyHtml = `<div class="post-body">${paras}</div>`;
    document.getElementById('post-newsletter').style.display = 'block';
  }

  document.title = post.title + ' — Kinky, Free Me';
  wrap.innerHTML = `
    <span class="post-back" onclick="history.back()">← Back to Journal</span>
    <div class="post-tag">${label}</div>
    <h1 class="post-title">${post.title}</h1>
    ${post.subtitle ? `<p class="post-subtitle">${post.subtitle}</p>` : ''}
    <div class="post-meta">
      <span>Gia Curls</span>
      <span>${KFM.formatDate(post.created_at)}</span>
      <span>${isPremium ? '✦ Members' : 'Free read'}</span>
    </div>
    ${cover}
    ${bodyHtml}`;
})();
</script>
